<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二屆長庚射箭公開邀請賽 | 核心管理系統</title>
    <!-- Last Build: 2026-05-05 02:39 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.0.4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .admin-wrapper { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: var(--sidebar-bg); padding: 3rem; border-radius: 1rem;
            width: 400px; border: 1px solid var(--glass-border); text-align: center;
        }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 0.75rem; border-radius: 0.5rem;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; outline: none;
        }
        .data-editor { margin-top: 2rem; background: var(--glass-bg); border-radius: 1rem; padding: 1.5rem; border: 1px solid var(--glass-border); }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .table-responsive { max-height: 60vh; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 0.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: var(--sidebar-bg); z-index: 10; }
        th, td { padding: 0.75rem; border: 1px solid var(--glass-border); }
        td input { background: transparent; border: none; color: white; width: 100%; }
        .btn-save { background: var(--accent-emerald); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.3rem; cursor: pointer; font-weight: 600; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .admin-tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); }
        .admin-tab { padding: 1rem; color: var(--text-secondary); cursor: pointer; font-weight: 600; }
        .admin-tab.active { color: var(--accent-blue); border-bottom: 2px solid var(--accent-blue); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        body { overflow-y: auto !important; } /* Allow scrolling in admin */
    </style>
</head>
<body class="dark-theme">
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h2>管理員驗證</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">請輸入管理密碼及 GitHub Token</p>
            <div class="input-group">
                <label>後台密碼</label>
                <input type="password" id="admin-pass" placeholder="輸入密碼 (預設: 1234)">
            </div>
            <div class="input-group">
                <label>GitHub Token</label>
                <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button class="upload-btn" id="login-btn" style="width: 100%; justify-content: center;">進入系統</button>
            <p id="auth-error" style="color: #ef4444; margin-top: 1rem; display: none;">驗證失敗，請檢查輸入內容</p>
        </div>
    </div>

    <!-- Main Admin UI -->
    <div class="admin-wrapper hidden" id="admin-ui">
        <header class="editor-header">
            <div>
                <h1>第二屆長庚射箭公開邀請賽</h1>
                <p style="color: var(--text-secondary)">CGU x CGUST 賽事數據即時管理系統</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="upload-btn" onclick="logout()">登出</button>
                <a href="index.html" class="upload-btn" style="text-decoration:none">返回前端</a>
            </div>
        </header>

        <div class="admin-tabs">
            <div class="admin-tab active" data-target="players-editor">📊 積分賽管理</div>
            <div class="admin-tab" data-target="matches-editor">🌿 淘汰賽管理</div>
        </div>

        <!-- Players Editor -->
        <div class="data-editor" id="players-editor">
            <div class="editor-header">
                <h2>📊 積分賽排名管理</h2>
                <button class="btn-save" id="save-players">同步積分至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-players-table">
                    <thead>
                        <tr>
                            <th>姓名</th><th>單位</th><th>分組</th><th>種子(1/0)</th><th>積分</th><th>勝</th><th>負</th><th>平</th>
                        </tr>
                    </thead>
                    <tbody id="edit-players-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Matches Editor -->
        <div class="data-editor hidden" id="matches-editor">
            <div class="editor-header">
                <h2>🌿 淘汰賽賽程管理</h2>
                <button class="btn-save" id="save-matches">同步賽程至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-matches-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>類別</th><th>分組</th><th>回合</th><th>選手 1</th><th>選手 2</th><th>勝者</th><th>比分 1</th><th>比分 2</th>
                        </tr>
                    </thead>
                    <tbody id="edit-matches-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        console.log('Admin Script Loading...');
        import { DataHandler } from './js/data-handler.js';
        const handler = new DataHandler();
        const REPO_OWNER = '687887s';
        const REPO_NAME = 'archery_race';
        let GITHUB_TOKEN = '';

        // Attach event listeners
        document.getElementById('login-btn').addEventListener('click', checkAuth);
        document.getElementById('save-players').addEventListener('click', () => saveToGithub('players'));
        document.getElementById('save-matches').addEventListener('click', () => saveToGithub('matches'));

        // Admin Tab Switching
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.data-editor').forEach(e => e.classList.add('hidden'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.remove('hidden');
            });
        });

        // Also allow Enter key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('auth-overlay').classList.contains('hidden')) {
                checkAuth();
            }
        });

        function checkAuth() {
            try {
                console.log('Auth Button Clicked');
                const pass = document.getElementById('admin-pass').value.trim();
                const token = document.getElementById('github-token').value.trim();
                
                console.log('Password entered:', pass);
                console.log('Token length:', token.length);
                
                // Allow the login even if token prefix is weird, but warn
                const isValidToken = token.length > 20; 
                
                if (pass === '1234') {
                    if (isValidToken) {
                        console.log('Credentials OK. Hiding overlay...');
                        GITHUB_TOKEN = token;
                        document.getElementById('auth-overlay').style.display = 'none';
                        document.getElementById('admin-ui').classList.remove('hidden');
                        console.log('Loading current data...');
                        loadCurrentData();
                    } else {
                        console.log('Token too short.');
                        document.getElementById('auth-error').style.display = 'block';
                        document.getElementById('auth-error').textContent = 'Token 長度不足，請重新確認';
                    }
                } else {
                    console.log('Wrong password.');
                    document.getElementById('auth-error').style.display = 'block';
                    document.getElementById('auth-error').textContent = '密碼錯誤 (預設為 1234)';
                }
            } catch (err) {
                console.error('CRITICAL AUTH ERROR:', err);
                alert('登入發生錯誤: ' + err.message);
            }
        }

        window.logout = () => location.reload();

        async function loadCurrentData() {
            try {
                // Load Players
                const pResp = await fetch('data/players.csv?t=' + Date.now());
                const pData = await handler.loadPlayers(await pResp.blob());
                renderEditor('edit-players-body', pData, ['name', 'unit', 'group', 'isSeed', 'points', 'wins', 'losses', 'draws']);

                // Load Matches
                const mResp = await fetch('data/matches.csv?t=' + Date.now());
                const mData = await handler.loadMatches(await mResp.blob());
                renderEditor('edit-matches-body', mData, ['matchId', 'type', 'group', 'round', 'player1', 'player2', 'winner', 'score1', 'score2']);
            } catch (err) {
                showToast('讀取原始數據失敗', true);
            }
        }

        function renderEditor(tbodyId, data, keys) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    const val = key === 'isSeed' ? (row[key] ? '1' : '0') : row[key];
                    td.innerHTML = `<input type="text" value="${val}" data-idx="${idx}" data-key="${key}">`;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        window.saveToGithub = async (type) => {
            const btn = document.getElementById(`save-${type}`);
            btn.disabled = true;
            btn.textContent = '同步中...';

            try {
                const tbody = document.getElementById(`edit-${type}-body`);
                const rows = Array.from(tbody.querySelectorAll('tr'));
                const data = rows.map(tr => {
                    const obj = {};
                    tr.querySelectorAll('input').forEach(input => {
                        obj[input.dataset.key] = input.value;
                    });
                    return obj;
                });

                const csv = Papa.unparse(data);
                const path = `data/${type}.csv`;
                
                // Get current file SHA for update
                const authHeader = GITHUB_TOKEN.startsWith('github_pat_') ? `Bearer ${GITHUB_TOKEN}` : `token ${GITHUB_TOKEN}`;
                
                const fileInfoResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': authHeader }
                });

                if (!fileInfoResponse.ok) {
                    const errData = await fileInfoResponse.json();
                    throw new Error(`無法獲取檔案資訊: ${errData.message}`);
                }
                const fileInfo = await fileInfoResponse.json();

                // Update file via API
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': authHeader,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Update ${type} data via Admin Portal`,
                        content: btoa(unescape(encodeURIComponent(csv))),
                        sha: fileInfo.sha
                    })
                });

                if (response.ok) {
                    showToast('同步成功！數據已更新至 GitHub。');
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            } catch (err) {
                console.error(err);
                showToast('同步失敗: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = `同步${type === 'players' ? '積分' : '賽程'}至 GitHub`;
            }
        };

        function showToast(message, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
