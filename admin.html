<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二屆長庚射箭公開邀請賽 | 核心管理系統</title>
    <!-- Last Build: 2026-05-11 17:08 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.3.54">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .admin-wrapper {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: var(--sidebar-bg);
            padding: 3rem;
            border-radius: 1rem;
            width: 400px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            outline: none;
        }

        .data-editor {
            margin-top: 2rem;
            background: var(--glass-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .table-responsive {
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 10;
        }

        th,
        td {
            padding: 0.75rem;
            border: 1px solid var(--glass-border);
        }

        td input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
        }

        .btn-save {
            background: var(--accent-emerald);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.3rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .admin-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .admin-tab {
            padding: 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
        }

        .admin-tab.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }

        body {
            overflow-y: auto !important;
        }

        /* Allow scrolling in admin */
    </style>
</head>

<body class="dark-theme">
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h2>管理員驗證</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">請輸入管理密碼及 GitHub Token</p>
            <div class="input-group">
                <label>後台密碼</label>
                <input type="password" id="admin-pass" placeholder="輸入密碼 (預設: 1234)">
            </div>
            <div class="input-group">
                <label>GitHub Token</label>
                <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button class="upload-btn" id="login-btn" style="width: 100%; justify-content: center;">進入系統</button>
            <p id="auth-error" style="color: #ef4444; margin-top: 1rem; display: none;">驗證失敗，請檢查輸入內容</p>
        </div>
    </div>

    <!-- Main Admin UI -->
    <div class="admin-wrapper hidden" id="admin-ui">
        <header class="editor-header">
            <div>
                <h1>第二屆長庚射箭公開邀請賽 <span style="font-size: 12px; opacity: 0.6;">v1.3.54</span></h1>
                <p style="color: var(--text-secondary)">CGU x CGUST 賽事數據即時管理系統</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <input type="file" id="full-excel-import" accept=".xlsx" style="display: none;">
                <button class="upload-btn" onclick="document.getElementById('full-excel-import').click()">📁 全檔案匯入
                    (XLSX)</button>
                <input type="file" id="csv-import" accept=".csv, .xlsx" style="display: none;">
                <button class="upload-btn" onclick="document.getElementById('csv-import').click()">📂 匯入單一分頁</button>
                <button class="upload-btn" onclick="logout()">登出</button>
                <a href="index.html" class="upload-btn" style="text-decoration:none">返回前端</a>
            </div>
        </header>

        <div class="admin-tabs">
            <div class="admin-tab active" data-target="players-editor">📊 積分賽管理</div>
            <div class="admin-tab" data-target="matches-editor">🌿 淘汰賽管理</div>
        </div>

        <div class="group-selector" style="margin-bottom: 1.5rem; justify-content: flex-start; gap: 1.5rem;">
            <div>
                <label style="color: var(--text-secondary); font-weight: 600;">管理模式：</label>
                <select id="admin-mode-select"
                    style="background: var(--sidebar-bg); color: white; border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 0.4rem;">
                    <option value="Individual">個人賽 (Individual)</option>
                    <option value="Team">團體賽 (Team)</option>
                </select>
            </div>
            <div>
                <label style="color: var(--text-secondary); font-weight: 600;">選擇分組：</label>
                <select id="admin-group-select"
                    style="background: var(--sidebar-bg); color: white; border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 0.4rem;">
                    <option value="反曲70">競技反曲弓 70m 公開組</option>
                    <option value="反曲30">競技反曲弓 30m 公開組</option>
                    <option value="傳統30">傳統弓 30m 公開組</option>
                    <option value="傳統20">傳統弓 20m 公開組</option>
                </select>
            </div>
        </div>

        <!-- Players Editor -->
        <div class="data-editor" id="players-editor">
            <div class="editor-header">
                <h2>📊 名單管理</h2>
                <button class="btn-save" id="save-players">同步全部分組名單至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-players-table">
                    <thead>
                        <tr id="players-table-head">
                            <!-- Dynamic Head -->
                        </tr>
                    </thead>
                    <tbody id="edit-players-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Matches Editor -->
        <div class="data-editor hidden" id="matches-editor">
            <div class="editor-header">
                <h2>🌿 賽程管理</h2>
                <button class="btn-save" id="save-matches">同步全部分組賽程至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-matches-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>類別</th>
                            <th>分組</th>
                            <th>回合</th>
                            <th>選手 1</th>
                            <th>選手 2</th>
                            <th>勝者</th>
                            <th>比分 1</th>
                            <th>比分 2</th>
                        </tr>
                    </thead>
                    <tbody id="edit-matches-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        console.log('Admin Script Loading...');
        import { DataHandler } from './js/data-handler.js?v=1.3.54';
        const handler = new DataHandler();
        const REPO_OWNER = '687887s';
        const REPO_NAME = 'archery_race';

        let fullIndividualData = [];
        let fullTeamData = [];
        let fullIndividualMatches = [];
        let fullTeamMatches = [];
        let GITHUB_TOKEN = (localStorage.getItem('github_token') || '').replace(/[^\x00-\x7F]/g, "");
        let currentAdminMode = 'Individual';
        let currentAdminGroup = '反曲70';

        // Attach event listeners
        document.getElementById('login-btn').addEventListener('click', checkAuth);
        document.getElementById('save-players').addEventListener('click', () => saveToGithub('players'));
        document.getElementById('save-matches').addEventListener('click', () => saveToGithub('matches'));

        // CSV Import Logic
        document.getElementById('csv-import').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                showToast('正在解析檔案...');
                const activeTab = document.querySelector('.admin-tab.active').dataset.target;

                if (activeTab === 'players-editor') {
                    const importedPlayers = await handler.loadPlayers(file);
                    if (importedPlayers.length > 0) {
                        if (currentAdminMode === 'Individual') fullIndividualData = importedPlayers;
                        else fullTeamData = importedPlayers;
                        showToast(`成功匯入 ${importedPlayers.length} 筆選手資料`);
                    }
                } else {
                    const importedMatches = await handler.loadMatches(file);
                    if (importedMatches.length > 0) {
                        if (currentAdminMode === 'Individual') fullIndividualMatches = importedMatches;
                        else fullTeamMatches = importedMatches;
                        showToast(`成功匯入 ${importedMatches.length} 筆賽程資料`);
                    }
                }

                renderAllEditors();
                e.target.value = '';
            } catch (err) {
                console.error(err);
                showToast('匯入失敗：' + err.message, true);
            }
        });

        // Full Workbook Import Logic
        document.getElementById('full-excel-import').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                showToast('正在解析全部分頁數據...');
                const results = await handler.processFullWorkbook(file);

                if (results.individual.length > 0 || results.team.length > 0 || results.individualMatches.length > 0 || results.teamMatches.length > 0) {
                    if (confirm(`解析成功：\n- 個人賽: ${results.individual.length} 筆\n- 團體賽: ${results.team.length} 筆\n- 個人對抗: ${results.individualMatches.length} 筆\n- 團體對抗: ${results.teamMatches.length} 筆\n\n是否確認覆蓋目前所有數據？`)) {
                        fullIndividualData = results.individual;
                        fullTeamData = results.team;
                        fullIndividualMatches = results.individualMatches;
                        fullTeamMatches = results.teamMatches;
                        renderAllEditors();
                        showToast('數據已載入編輯器，請檢查後儲存');
                    }
                } else {
                    showToast('未在檔案中找到有效的數據分頁', true);
                }
                e.target.value = '';
            } catch (err) {
                console.error(err);
                showToast('全檔案匯入失敗：' + err.message, true);
            }
        });

        document.getElementById('admin-mode-select').addEventListener('change', (e) => {
            currentAdminMode = e.target.value;
            renderAllEditors();
        });

        document.getElementById('admin-group-select').addEventListener('change', (e) => {
            currentAdminGroup = e.target.value;
            renderAllEditors();
        });

        // Admin Tab Switching
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.data-editor').forEach(e => e.classList.add('hidden'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.remove('hidden');
            });
        });

        function checkAuth() {
            try {
                const pass = document.getElementById('admin-pass').value.trim();
                const rawToken = document.getElementById('github-token').value.trim();
                // Strictly filter to ASCII only to prevent ISO-8859-1 fetch errors
                const token = rawToken.replace(/[^\x00-\x7F]/g, "");

                if (pass === '1234' && token.length > 20) {
                    GITHUB_TOKEN = token;
                    localStorage.setItem('github_token', token);
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('admin-ui').classList.remove('hidden');
                    loadCurrentData();
                } else {
                    document.getElementById('auth-error').style.display = 'block';
                }
            } catch (err) { alert(err.message); }
        }

        window.logout = () => location.reload();

        // Initialize UI with saved token
        window.addEventListener('DOMContentLoaded', () => {
            if (GITHUB_TOKEN) {
                document.getElementById('github-token').value = GITHUB_TOKEN;
            }
        });

        async function loadCurrentData() {
            try {
                showToast(`正在讀取全場數據...`);

                const pIndResp = await fetch(`data/individual_players.csv?t=${Date.now()}`);
                fullIndividualData = await handler.loadPlayers(await pIndResp.blob());

                const pTeamResp = await fetch(`data/team_players.csv?t=${Date.now()}`);
                fullTeamData = await handler.loadPlayers(await pTeamResp.blob());

                const mIndResp = await fetch(`data/individual_matches.csv?t=${Date.now()}`);
                fullIndividualMatches = await handler.loadMatches(await mIndResp.blob());

                const mTeamResp = await fetch(`data/team_matches.csv?t=${Date.now()}`);
                fullTeamMatches = await handler.loadMatches(await mTeamResp.blob());

                renderAllEditors();
                showToast('數據載入成功');
            } catch (err) {
                console.error(err);
                showToast('部分數據載入失敗', true);
            }
        }

        function renderAllEditors() {
            const playerKeys = currentAdminMode === 'Individual'
                ? ['id', 'unit', 'name', 'target', 'r1', 'total', 'rank', 'xCount', 'tenXCount', 'group']
                : ['id', 'unit', 'name', 'team', 'target', 'r1', 'total', 'rank', 'xCount', 'tenXCount', 'group'];

            const head = document.getElementById('players-table-head');
            const labels = {
                'id': '編號', 'unit': '單位', 'name': '姓名', 'target': '靶位',
                'r1': '單局成績', 'total': '總分', 'rank': '排名',
                'xCount': 'X', 'tenXCount': '10+X', 'group': '組別', 'team': '隊伍'
            };
            head.innerHTML = playerKeys.map(k => `<th>${labels[k] || k}</th>`).join('');

            const currentPlayers = currentAdminMode === 'Individual' ? fullIndividualData : fullTeamData;
            const currentMatches = currentAdminMode === 'Individual' ? fullIndividualMatches : fullTeamMatches;

            renderEditor('edit-players-body', currentPlayers, playerKeys);
            renderEditor('edit-matches-body', currentMatches, ['matchId', 'type', 'group', 'round', 'player1', 'player2', 'winner', 'score1', 'score2', 'target']);
        }

        function renderEditor(tbodyId, data, keys) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';

            const filteredData = data.filter(row => row.group === currentAdminGroup);

            filteredData.forEach((row) => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    const val = key === 'isSeed' ? (row[key] ? '1' : '0') : row[key];
                    const isReadOnly = (key === 'name' || key === 'unit' || key === 'matchId' || key.toLowerCase() === 'total' || key === 'rank');

                    if (key === 'group' || key === 'type' || key === 'isSeed') {
                        const select = document.createElement('select');
                        // ... select setup code ...
                        select.style.width = '100%';
                        select.style.background = 'transparent';
                        select.style.color = 'white';
                        select.style.border = 'none';

                        if (key === 'group') {
                            const groups = ['反曲70', '反曲30', '傳統30', '傳統20'];
                            groups.forEach(g => {
                                const opt = document.createElement('option');
                                opt.value = g;
                                opt.textContent = g;
                                opt.style.background = '#1e293b';
                                if (g === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        } else if (key === 'type') {
                            const types = [
                                { val: 'Individual', label: '個人 (Individual)' },
                                { val: 'Team', label: '團體 (Team)' }
                            ];
                            types.forEach(t => {
                                const opt = document.createElement('option');
                                opt.value = t.val;
                                opt.textContent = t.label;
                                opt.style.background = '#1e293b';
                                if (t.val === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        } else if (key === 'isSeed') {
                            ['1', '0'].forEach(s => {
                                const opt = document.createElement('option');
                                opt.value = s;
                                opt.textContent = s === '1' ? 'Seed' : 'Normal';
                                opt.style.background = '#1e293b';
                                if (s === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        }

                        select.addEventListener('change', (e) => {
                            if (key === 'isSeed') row[key] = (e.target.value === '1');
                            else row[key] = e.target.value;
                        });
                        td.appendChild(select);
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = val !== undefined ? val : '';
                        if (isReadOnly) {
                            input.readOnly = true;
                            input.style.opacity = '0.7';
                            input.style.cursor = 'not-allowed';
                        }

                        input.addEventListener('input', (e) => {
                            row[key] = e.target.value;

                            // Auto-calculate total if r1 or r2 changes
                            if (key === 'r1' || key === 'r2') {
                                const val1 = parseInt(row.r1) || 0;
                                const val2 = parseInt(row.r2) || 0;
                                row.total = val1 + val2;

                                const totalInput = tr.querySelector('input[data-key="total"]');
                                if (totalInput) totalInput.value = row.total;
                            }
                        });

                        input.setAttribute('data-key', key);
                        td.appendChild(input);
                    }

                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        async function uploadToGithub(path, data) {
            const token = GITHUB_TOKEN;
            if (!token) throw new Error('請先登入並輸入 GitHub Token');

            const owner = '687887s';
            const repo = 'archery_race';
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const csv = Papa.unparse(data);

            let sha = '';
            try {
                const resp = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (resp.ok) {
                    const fileData = await resp.json();
                    sha = fileData.sha;
                }
            } catch (e) { }

            const updateResp = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Data Update ${new Date().toISOString()}`,
                    content: btoa(unescape(encodeURIComponent(csv))),
                    sha: sha
                })
            });
            if (!updateResp.ok) {
                const errData = await updateResp.json();
                throw new Error(errData.message || 'GitHub 同步失敗');
            }
        }

        window.saveAll = async () => {
            const btn = document.getElementById('save-btn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '全場同步中...';
            }

            try {
                const targets = [
                    { path: 'data/individual_players.csv', data: fullIndividualData },
                    { path: 'data/team_players.csv', data: fullTeamData },
                    { path: 'data/individual_matches.csv', data: fullIndividualMatches },
                    { path: 'data/team_matches.csv', data: fullTeamMatches }
                ];

                for (const target of targets) {
                    if (target.data && target.data.length > 0) {
                        await uploadToGithub(target.path, target.data);
                    }
                }
                showToast('✅ 全場數據同步成功！');
            } catch (err) {
                console.error(err);
                showToast('❌ 同步失敗: ' + err.message, true);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '💾 儲存所有變更';
                }
            }
        };

        window.saveToGithub = async () => await window.saveAll();

        function showToast(message, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>

</html>
