<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二屆長庚射箭公開邀請賽 | 核心管理系統</title>
    <!-- Last Build: 2026-05-15 09:27 (v1.5.7-15) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.5.7-15">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .admin-wrapper {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: var(--sidebar-bg);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        /* 強制將 Admin 介面文字設為黑色 */
        #admin-ui, #admin-ui *, 
        .admin-table input, 
        .admin-table select {
            color: #000000 !important;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: black;
            outline: none;
        }

        .data-editor {
            margin-top: 2rem;
            background: var(--glass-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .table-responsive {
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 10;
            text-align: center;
        }

        th,
        td {
            padding: 0.5rem 1rem;
            border: 1px solid var(--glass-border);
            white-space: nowrap;
            text-align: center;
        }

        td input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            padding: 2px 4px;
        }

        /* Adjust input widths based on data keys */
        td input[data-key="score"],
        td input[data-key="total"],
        td input[data-key="rank"],
        td input[data-key="xCount"],
        td input[data-key="tenXCount"],
        td input[data-key="score1"],
        td input[data-key="score2"] {
            width: 60px;
            text-align: center;
        }

        td input[data-key="id"],
        td input[data-key="matchId"] {
            width: 120px;
            text-align: center;
        }

        td input[data-key="target"] {
            width: 65px;
            text-align: center;
        }

        td input[data-key="name"],
        td input[data-key="player1"],
        td input[data-key="player2"] {
            width: 100px;
            text-align: center;
        }

        td input[data-key="team"],
        td input[data-key="unit"],
        td input[data-key="unit1"],
        td input[data-key="unit2"] {
            width: 200px;
        }

        td input[data-key="names1"],
        td input[data-key="names2"] {
            width: 300px;
        }

        .btn-save {
            background: var(--accent-emerald);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.3rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .admin-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .admin-tab {
            padding: 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
        }

        .admin-tab.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }

        body {
            overflow-y: auto !important;
        }

        /* Allow scrolling in admin */
    </style>
</head>

<body class="dark-theme">
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h2>管理員驗證</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">請輸入管理密碼及 GitHub Token</p>
            <div class="input-group">
                <label>後台密碼</label>
                <input type="password" id="admin-pass" placeholder="輸入密碼 (預設: 1234)">
            </div>
            <div class="input-group">
                <label>GitHub Token</label>
                <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button class="upload-btn" id="login-btn" style="width: 100%; justify-content: center;">進入系統</button>
            <p id="auth-error" style="color: #ef4444; margin-top: 1rem; display: none;">驗證失敗，請檢查輸入內容</p>
        </div>
    </div>

    <!-- Main Admin UI -->
    <div class="admin-wrapper hidden" id="admin-ui">
        <header class="editor-header">
            <div>
                <h1>第二屆長庚射箭公開邀請賽 <span style="font-size: 12px; opacity: 0.6;">v1.5.7-15</span></h1>
                <p style="color: #000000">CGU x CGUST 賽事數據即時管理系統</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <input type="file" id="full-excel-import" accept=".xlsx" style="display: none;">
                <button class="upload-btn" onclick="document.getElementById('full-excel-import').click()">📁 全檔案匯入
                    (XLSX)</button>

                <button class="upload-btn" onclick="logout()">登出</button>
                <a href="index.html" class="upload-btn" style="text-decoration:none">返回前端</a>
            </div>
        </header>

        <div class="admin-tabs">
            <div class="admin-tab active" data-target="players-editor">📊 積分賽管理</div>
            <div class="admin-tab" data-target="matches-editor">🌿 淘汰賽管理</div>
        </div>

        <div class="group-selector" style="margin-bottom: 1.5rem; justify-content: flex-start; gap: 1.5rem;">
            <div>
                <label style="color: var(--text-secondary); font-weight: 600;">管理模式：</label>
                <select id="admin-mode-select"
                    style="background: var(--sidebar-bg); color: white; border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 0.4rem;">
                    <option value="Individual">個人賽 (Individual)</option>
                    <option value="Team">團體賽 (Team)</option>
                </select>
            </div>
            <div>
                <label style="color: var(--text-secondary); font-weight: 600;">選擇分組：</label>
                <select id="admin-group-select"
                    style="background: var(--sidebar-bg); color: white; border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 0.4rem;">
                    <option value="反曲70">競技反曲弓 70m 公開組</option>
                    <option value="反曲30">競技反曲弓 30m 公開組</option>
                    <option value="傳統30">傳統弓 30m 公開組</option>
                    <option value="傳統20">傳統弓 20m 公開組</option>
                </select>
            </div>
        </div>

        <!-- Players Editor -->
        <div class="data-editor" id="players-editor">
            <div class="editor-header">
                <h2>📊 名單管理</h2>
                <button class="btn-save" id="save-players">同步全部分組名單至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-players-table">
                    <thead>
                        <tr id="players-table-head">
                            <!-- Dynamic Head -->
                        </tr>
                    </thead>
                    <tbody id="edit-players-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Matches Editor -->
        <div class="data-editor hidden" id="matches-editor">
            <div class="editor-header">
                <h2>🌿 賽程管理</h2>
                <button class="btn-save" id="save-matches">同步全部分組賽程至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-matches-table">
                    <thead>
                        <tr id="matches-table-head">
                            <!-- Dynamic Head -->
                        </tr>
                    </thead>
                    <tbody id="edit-matches-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        console.log('Admin Script Loading...');
        import { DataHandler } from './js/data-handler.js?v=1.5.7-15';
        const handler = new DataHandler();
        const REPO_OWNER = '687887s';
        const REPO_NAME = 'archery_race';

        let fullIndividualData = [];
        let fullTeamData = [];
        let fullIndividualMatches = [];
        let fullTeamMatches = [];
        let GITHUB_TOKEN = (localStorage.getItem('github_token') || '').replace(/[^\x00-\x7F]/g, "");
        let currentAdminMode = 'Individual';
        window.currentAdminGroup = '反曲70';
        let currentAdminGroup = window.currentAdminGroup;

        // Attach event listeners
        document.getElementById('login-btn').addEventListener('click', checkAuth);
        document.getElementById('save-players').addEventListener('click', () => saveToGithub('players'));
        document.getElementById('save-matches').addEventListener('click', () => saveToGithub('matches'));

        // Full Workbook Import Logic
        document.getElementById('full-excel-import').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                showToast('正在解析全部分頁數據...');
                const results = await handler.processFullWorkbook(file);

                if (results.individual.length > 0 || results.team.length > 0 || results.individualMatches.length > 0 || results.teamMatches.length > 0) {
                    if (confirm(`解析成功：\n- 個人賽: ${results.individual.length} 筆\n- 團體賽: ${results.team.length} 筆\n- 個人對抗: ${results.individualMatches.length} 筆\n- 團體對抗: ${results.teamMatches.length} 筆\n\n是否確認覆蓋目前所有數據？`)) {
                        fullIndividualData = results.individual;
                        fullTeamData = results.team;
                        fullIndividualMatches = results.individualMatches;
                        fullTeamMatches = results.teamMatches;
                        renderAllEditors();
                        showToast('數據已載入編輯器，請檢查後儲存');
                    }
                } else {
                    showToast('未在檔案中找到有效的數據分頁', true);
                }
                e.target.value = '';
            } catch (err) {
                console.error(err);
                showToast('全檔案匯入失敗：' + err.message, true);
            }
        });

        document.getElementById('admin-mode-select').addEventListener('change', (e) => {
            currentAdminMode = e.target.value;
            renderAllEditors();
        });

        document.getElementById('admin-group-select').addEventListener('change', (e) => {
            currentAdminGroup = e.target.value;
            window.currentAdminGroup = e.target.value;
            renderAllEditors();
        });

        // Admin Tab Switching
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.data-editor').forEach(e => e.classList.add('hidden'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.remove('hidden');
            });
        });

        function checkAuth() {
            try {
                const pass = document.getElementById('admin-pass').value.trim();
                const rawToken = document.getElementById('github-token').value.trim();
                // Strictly filter to ASCII only to prevent ISO-8859-1 fetch errors
                const token = rawToken.replace(/[^\x00-\x7F]/g, "");

                if (pass === '1234' && token.length > 20) {
                    GITHUB_TOKEN = token;
                    localStorage.setItem('github_token', token);
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('admin-ui').classList.remove('hidden');
                    loadCurrentData();
                } else {
                    document.getElementById('auth-error').style.display = 'block';
                }
            } catch (err) { alert(err.message); }
        }

        window.logout = () => location.reload();

        // Initialize UI with saved token
        window.addEventListener('DOMContentLoaded', () => {
            if (GITHUB_TOKEN) {
                document.getElementById('github-token').value = GITHUB_TOKEN;
            }
        });

        async function loadCurrentData() {
            try {
                showToast(`正在讀取全場數據...`);

                try {
                    const pIndResp = await fetch(`data/individual_players.csv?t=${Date.now()}`);
                    if (pIndResp.ok) fullIndividualData = await handler.loadPlayers(await pIndResp.blob());
                } catch(e) { console.warn('Missing individual_players.csv'); }

                try {
                    const pTeamResp = await fetch(`data/team_players.csv?t=${Date.now()}`);
                    if (pTeamResp.ok) fullTeamData = await handler.loadPlayers(await pTeamResp.blob());
                } catch(e) { console.warn('Missing team_players.csv'); }

                try {
                    const mIndResp = await fetch(`data/individual_matches.csv?t=${Date.now()}`);
                    if (mIndResp.ok) fullIndividualMatches = await handler.loadMatches(await mIndResp.blob());
                } catch(e) { console.warn('Missing individual_matches.csv'); }

                try {
                    const mTeamResp = await fetch(`data/team_matches.csv?t=${Date.now()}`);
                    if (mTeamResp.ok) fullTeamMatches = await handler.loadMatches(await mTeamResp.blob());
                } catch(e) { console.warn('Missing team_matches.csv'); }

                renderAllEditors();
                showToast('數據載入成功');
            } catch (err) {
                console.error(err);
                showToast('部分數據載入失敗', true);
            }
        }

        function renderAllEditors() {
            const playerKeys = currentAdminMode === 'Individual'
                ? ['id', 'unit', 'name', 'target', 'score', 'total', 'rank', 'xCount', 'tenXCount']
                : ['unit', 'name', 'target', 'score', 'total', 'rank', 'xCount', 'tenXCount'];

            const head = document.getElementById('players-table-head');
            const labels = {
                'id': '編號', 'unit': '單位', 'name': '姓名', 'target': '靶位',
                'score': '單局成績', 'total': '總分', 'rank': '排名',
                'xCount': 'X', 'tenXCount': '10+X', 'group': '組別', 'team': '隊伍',
                'matchId': 'ID', 'type': '類別', 'round': '回合', 'player1': '選手1', 'player2': '選手2',
                'unit1': '單位1', 'unit2': '單位2',
                'names1': '成員1', 'names2': '成員2', 'winner': '勝者', 'score1': '比分1', 'score2': '比分2'
            };
            
            if (currentAdminMode === 'Team') {
                labels['unit'] = '隊伍';
                labels['player1'] = '隊伍1';
                labels['player2'] = '隊伍2';
            }

            head.innerHTML = playerKeys.map(k => `<th>${labels[k] || k}</th>`).join('');

            const currentPlayers = currentAdminMode === 'Individual' ? fullIndividualData : fullTeamData;
            const currentMatches = currentAdminMode === 'Individual' ? fullIndividualMatches : fullTeamMatches;

            renderEditor('edit-players-body', currentPlayers, playerKeys);
            
            const matchKeys = currentAdminMode === 'Individual'
                ? ['matchId', 'round', 'player1', 'unit1', 'player2', 'unit2', 'winner', 'score1', 'score2', 'target']
                : ['matchId', 'round', 'player1', 'player2', 'names1', 'names2', 'winner', 'score1', 'score2', 'target'];
            
            const matchHead = document.getElementById('matches-table-head');
            if (matchHead) matchHead.innerHTML = matchKeys.map(k => `<th>${labels[k] || k}</th>`).join('');

            renderEditor('edit-matches-body', currentMatches, matchKeys);
        }

        function renderEditor(tbodyId, data, keys) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';

            const currentGroupClean = currentAdminGroup.trim().replace('團體', '');
            const filteredData = data.filter(row => 
                (row.group || '').toString().trim().replace('團體', '') === currentGroupClean
            );

            filteredData.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    // Handle Rowspan for Team Name (unit), Rank, and Total in Team Mode
                    if (currentAdminMode === 'Team' && (key === 'unit' || key === 'rank' || key === 'total')) {
                        // Check if this is the start of a team block (assuming 3 players per team)
                        if (rowIndex % 3 === 0) {
                            const td = document.createElement('td');
                            td.rowSpan = 3;
                            const input = document.createElement('input');
                            input.type = 'text';
                            
                            // For Team Mode Total, calculate sum if needed
                            let displayVal = row[key] || '';
                            if (key === 'total') {
                                const p1 = parseInt(filteredData[rowIndex].score) || 0;
                                const p2 = parseInt(filteredData[rowIndex+1]?.score) || 0;
                                const p3 = parseInt(filteredData[rowIndex+2]?.score) || 0;
                                displayVal = p1 + p2 + p3;
                                // Sync back to data
                                row.total = displayVal;
                                if (filteredData[rowIndex+1]) filteredData[rowIndex+1].total = displayVal;
                                if (filteredData[rowIndex+2]) filteredData[rowIndex+2].total = displayVal;
                            }

                            input.value = displayVal;
                            input.readOnly = true;
                            input.style.opacity = '0.7';
                            input.style.cursor = 'not-allowed';
                            input.setAttribute('data-key', key);
                            input.id = `merged-${key}-${rowIndex}`; // ID for dynamic updates
                            td.appendChild(input);
                            tr.appendChild(td);
                        }
                        return; // Skip for rowIndex % 3 !== 0
                    }

                    const td = document.createElement('td');
                    const val = key === 'isSeed' ? (row[key] ? '1' : '0') : row[key];
                    const isReadOnly = (key === 'id' || key === 'name' || key === 'unit' || key === 'matchId' || key.toLowerCase() === 'total' || key === 'rank');

                    if (key === 'group' || key === 'type' || key === 'isSeed') {
                        const select = document.createElement('select');
                        // ... select setup code ...
                        select.style.width = '100%';
                        select.style.background = 'transparent';
                        select.style.color = 'white';
                        select.style.border = 'none';

                        if (key === 'group') {
                            const groups = ['反曲70', '反曲30', '傳統30', '傳統20'];
                            groups.forEach(g => {
                                const opt = document.createElement('option');
                                opt.value = g;
                                opt.textContent = g;
                                opt.style.background = '#1e293b';
                                if (g === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        } else if (key === 'type') {
                            const types = [
                                { val: 'Individual', label: '個人 (Individual)' },
                                { val: 'Team', label: '團體 (Team)' }
                            ];
                            types.forEach(t => {
                                const opt = document.createElement('option');
                                opt.value = t.val;
                                opt.textContent = t.label;
                                opt.style.background = '#1e293b';
                                if (t.val === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        } else if (key === 'isSeed') {
                            ['1', '0'].forEach(s => {
                                const opt = document.createElement('option');
                                opt.value = s;
                                opt.textContent = s === '1' ? 'Seed' : 'Normal';
                                opt.style.background = '#1e293b';
                                if (s === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        }

                        select.addEventListener('change', (e) => {
                            if (key === 'isSeed') row[key] = (e.target.value === '1');
                            else row[key] = e.target.value;
                        });
                        td.appendChild(select);
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        
                        let displayVal = val !== undefined ? val : '';
                        
                        // Beautify Match ID for display
                        if (key === 'matchId' && typeof displayVal === 'string') {
                            displayVal = displayVal
                                .replace('MT-', '團體-')
                                .replace('M-', '')
                                .replace('1/8', '16強賽')
                                .replace('1/4', '8強賽')
                                .replace('1/2', '4強賽')
                                .replace('Final', '金牌賽')
                                .replace('Bronze', '銅牌賽');
                        }

                        input.value = displayVal;
                        if (isReadOnly) {
                            input.readOnly = true;
                            input.style.opacity = '0.7';
                            input.style.cursor = 'not-allowed';
                        }

                        input.addEventListener('input', (e) => {
                            row[key] = e.target.value;

                            // Auto-calculate total if score changes
                            if (key === 'score') {
                                if (currentAdminMode === 'Individual') {
                                    const val = parseInt(row.score) || 0;
                                    row.total = val;
                                    const totalInput = tr.querySelector('input[data-key="total"]');
                                    if (totalInput) totalInput.value = row.total;
                                } else {
                                    // Team Mode Summation
                                    const startIdx = rowIndex - (rowIndex % 3);
                                    const s1 = parseInt(filteredData[startIdx].score) || 0;
                                    const s2 = parseInt(filteredData[startIdx+1]?.score) || 0;
                                    const s3 = parseInt(filteredData[startIdx+2]?.score) || 0;
                                    const teamTotal = s1 + s2 + s3;
                                    
                                    // Update all 3 rows in data
                                    for(let i=0; i<3; i++) {
                                        if (filteredData[startIdx+i]) filteredData[startIdx+i].total = teamTotal;
                                    }

                                    // Update the merged UI input
                                    const totalInput = document.getElementById(`merged-total-${startIdx}`);
                                    if (totalInput) totalInput.value = teamTotal;
                                }
                            }
                        });

                        input.setAttribute('data-key', key);
                        td.appendChild(input);
                    }

                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        async function uploadToGithub(path, data) {
            const token = GITHUB_TOKEN;
            if (!token) throw new Error('請先登入並輸入 GitHub Token');

            const owner = '687887s';
            const repo = 'archery_race';
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const csv = Papa.unparse(data);

            let sha = '';
            try {
                const resp = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (resp.ok) {
                    const fileData = await resp.json();
                    sha = fileData.sha;
                }
            } catch (e) { }

            const updateResp = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Data Update ${new Date().toISOString()}`,
                    content: btoa(unescape(encodeURIComponent(csv))),
                    sha: sha
                })
            });
            if (!updateResp.ok) {
                const errData = await updateResp.json();
                throw new Error(errData.message || 'GitHub 同步失敗');
            }
        }

        window.saveAll = async () => {
            const btn = document.getElementById('save-btn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '全場同步中...';
            }

            try {
                const targets = [
                    { path: 'data/individual_players.csv', data: fullIndividualData },
                    { path: 'data/team_players.csv', data: fullTeamData },
                    { path: 'data/individual_matches.csv', data: fullIndividualMatches },
                    { path: 'data/team_matches.csv', data: fullTeamMatches }
                ];

                for (const target of targets) {
                    await uploadToGithub(target.path, target.data || []);
                    await new Promise(r => setTimeout(r, 500));
                }
                showToast('✅ 全場數據同步成功！');
            } catch (err) {
                console.error(err);
                showToast('❌ 同步失敗: ' + err.message, true);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '💾 儲存所有變更';
                }
            }
        };

        window.saveToGithub = async () => await window.saveAll();

        function showToast(message, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>

</html>
