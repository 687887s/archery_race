<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二屆長庚射箭公開邀請賽 | 核心管理系統</title>
    <!-- Last Build: 2026-05-11 17:08 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.0.4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .admin-wrapper { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: var(--sidebar-bg); padding: 3rem; border-radius: 1rem;
            width: 400px; border: 1px solid var(--glass-border); text-align: center;
        }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 0.75rem; border-radius: 0.5rem;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; outline: none;
        }
        .data-editor { margin-top: 2rem; background: var(--glass-bg); border-radius: 1rem; padding: 1.5rem; border: 1px solid var(--glass-border); }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .table-responsive { max-height: 60vh; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 0.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: var(--sidebar-bg); z-index: 10; }
        th, td { padding: 0.75rem; border: 1px solid var(--glass-border); }
        td input { background: transparent; border: none; color: white; width: 100%; }
        .btn-save { background: var(--accent-emerald); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.3rem; cursor: pointer; font-weight: 600; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .admin-tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); }
        .admin-tab { padding: 1rem; color: var(--text-secondary); cursor: pointer; font-weight: 600; }
        .admin-tab.active { color: var(--accent-blue); border-bottom: 2px solid var(--accent-blue); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        body { overflow-y: auto !important; } /* Allow scrolling in admin */
    </style>
</head>
<body class="dark-theme">
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h2>管理員驗證</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">請輸入管理密碼及 GitHub Token</p>
            <div class="input-group">
                <label>後台密碼</label>
                <input type="password" id="admin-pass" placeholder="輸入密碼 (預設: 1234)">
            </div>
            <div class="input-group">
                <label>GitHub Token</label>
                <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button class="upload-btn" id="login-btn" style="width: 100%; justify-content: center;">進入系統</button>
            <p id="auth-error" style="color: #ef4444; margin-top: 1rem; display: none;">驗證失敗，請檢查輸入內容</p>
        </div>
    </div>

    <!-- Main Admin UI -->
    <div class="admin-wrapper hidden" id="admin-ui">
        <header class="editor-header">
            <div>
                <h1>第二屆長庚射箭公開邀請賽</h1>
                <p style="color: var(--text-secondary)">CGU x CGUST 賽事數據即時管理系統</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <input type="file" id="csv-import" accept=".csv" style="display: none;">
                <button class="upload-btn" onclick="document.getElementById('csv-import').click()">📂 批量匯入 CSV</button>
                <button class="upload-btn" onclick="logout()">登出</button>
                <a href="index.html" class="upload-btn" style="text-decoration:none">返回前端</a>
            </div>
        </header>

        <div class="admin-tabs">
            <div class="admin-tab active" data-target="players-editor">📊 積分賽管理</div>
            <div class="admin-tab" data-target="matches-editor">🌿 淘汰賽管理</div>
        </div>

        <div class="group-selector" style="margin-bottom: 1.5rem; justify-content: flex-start; gap: 1.5rem;">
            <div>
                <label style="color: var(--text-secondary); font-weight: 600;">管理模式：</label>
                <select id="admin-mode-select" style="background: var(--sidebar-bg); color: white; border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 0.4rem;">
                    <option value="Individual">個人賽 (Individual)</option>
                    <option value="Team">團體賽 (Team)</option>
                </select>
            </div>
            <div>
                <label style="color: var(--text-secondary); font-weight: 600;">選擇分組：</label>
                <select id="admin-group-select" style="background: var(--sidebar-bg); color: white; border: 1px solid var(--glass-border); padding: 0.5rem; border-radius: 0.4rem;">
                    <option value="Recurve-70m">競技反曲弓 70m 公開組</option>
                    <option value="Recurve-30m">競技反曲弓 30m 公開組</option>
                    <option value="Traditional-30m">傳統弓 30m 公開組</option>
                    <option value="Traditional-20m-Open">傳統弓 20m 公開組</option>
                    <option value="Traditional-20m-Student">傳統弓 20m 學生組</option>
                </select>
            </div>
        </div>

        <!-- Players Editor -->
        <div class="data-editor" id="players-editor">
            <div class="editor-header">
                <h2>📊 名單管理</h2>
                <button class="btn-save" id="save-players">同步全部分組名單至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-players-table">
                    <thead>
                        <tr id="players-table-head">
                            <!-- Dynamic Head -->
                        </tr>
                    </thead>
                    <tbody id="edit-players-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Matches Editor -->
        <div class="data-editor hidden" id="matches-editor">
            <div class="editor-header">
                <h2>🌿 賽程管理</h2>
                <button class="btn-save" id="save-matches">同步全部分組賽程至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-matches-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>類別</th><th>分組</th><th>回合</th><th>選手 1</th><th>選手 2</th><th>勝者</th><th>比分 1</th><th>比分 2</th>
                        </tr>
                    </thead>
                    <tbody id="edit-matches-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        console.log('Admin Script Loading...');
        import { DataHandler } from './js/data-handler.js?v=1.2.1';
        const handler = new DataHandler();
        const REPO_OWNER = '687887s';
        const REPO_NAME = 'archery_race';
        let GITHUB_TOKEN = '';
        
        let fullPlayerData = [];
        let fullMatchData = [];
        let currentAdminMode = 'Individual';
        let currentAdminGroup = 'Recurve-70m';

        // Attach event listeners
        document.getElementById('login-btn').addEventListener('click', checkAuth);
        document.getElementById('save-players').addEventListener('click', () => saveToGithub('players'));
        document.getElementById('save-matches').addEventListener('click', () => saveToGithub('matches'));
        
        // CSV Import Logic
        document.getElementById('csv-import').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                showToast('正在解析 CSV...');
                const activeTab = document.querySelector('.admin-tab.active').dataset.target;
                
                if (activeTab === 'players-editor') {
                    const importedPlayers = await handler.loadPlayers(file);
                    if (importedPlayers.length > 0) {
                        // Check if the imported data has the current group
                        const hasCurrentGroup = importedPlayers.some(p => p.group === currentAdminGroup);
                        
                        if (!hasCurrentGroup) {
                            if (!confirm('匯入的資料中不包含目前選取的組別，是否仍要替換全部分組名單？')) return;
                        }
                        
                        fullPlayerData = importedPlayers;
                        showToast(`成功匯入 ${importedPlayers.length} 筆選手資料`);
                    }
                } else {
                    const importedMatches = await handler.loadMatches(file);
                    if (importedMatches.length > 0) {
                        fullMatchData = importedMatches;
                        showToast(`成功匯入 ${importedMatches.length} 筆賽程資料`);
                    }
                }
                
                renderAllEditors();
                // Reset file input
                e.target.value = '';
            } catch (err) {
                console.error(err);
                showToast('匯入失敗：' + err.message, true);
            }
        });
        
        document.getElementById('admin-mode-select').addEventListener('change', (e) => {
            currentAdminMode = e.target.value;
            loadCurrentData();
        });
        
        document.getElementById('admin-group-select').addEventListener('change', (e) => {
            currentAdminGroup = e.target.value;
            renderAllEditors();
        });

        // Admin Tab Switching
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.data-editor').forEach(e => e.classList.add('hidden'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.remove('hidden');
            });
        });

        function checkAuth() {
            try {
                const pass = document.getElementById('admin-pass').value.trim();
                const token = document.getElementById('github-token').value.trim();
                
                if (pass === '1234' && token.length > 20) {
                    GITHUB_TOKEN = token;
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('admin-ui').classList.remove('hidden');
                    loadCurrentData();
                } else {
                    document.getElementById('auth-error').style.display = 'block';
                }
            } catch (err) { alert(err.message); }
        }

        window.logout = () => location.reload();

        async function loadCurrentData() {
            try {
                showToast(`正在讀取 ${currentAdminMode} 數據...`);
                const pFile = currentAdminMode === 'Individual' ? 'individual_players.csv' : 'team_players.csv';
                const mFile = currentAdminMode === 'Individual' ? 'individual_matches.csv' : 'team_matches.csv';

                const pResp = await fetch(`data/${pFile}?t=${Date.now()}`);
                fullPlayerData = await handler.loadPlayers(await pResp.blob());

                const mResp = await fetch(`data/${mFile}?t=${Date.now()}`);
                fullMatchData = await handler.loadMatches(await mResp.blob());
                
                renderAllEditors();
            } catch (err) {
                showToast('讀取原始數據失敗', true);
            }
        }

        function renderAllEditors() {
            const playerKeys = currentAdminMode === 'Individual' 
                ? ['name', 'unit', 'group', 'r1', 'r2', 'total']
                : ['name', 'team', 'group', 'r1', 'r2', 'total'];
            
            const head = document.getElementById('players-table-head');
            head.innerHTML = playerKeys.map(k => `<th>${k.toUpperCase() === 'TEAM' ? '隊伍' : k.toUpperCase()}</th>`).join('');

            renderEditor('edit-players-body', fullPlayerData, playerKeys);
            renderEditor('edit-matches-body', fullMatchData, ['matchId', 'type', 'group', 'round', 'player1', 'player2', 'winner', 'score1', 'score2']);
        }

        function renderEditor(tbodyId, data, keys) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            
            const filteredData = data.filter(row => row.group === currentAdminGroup);

            filteredData.forEach((row) => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    const val = key === 'isSeed' ? (row[key] ? '1' : '0') : row[key];
                    const isReadOnly = (key === 'name' || key === 'unit' || key === 'matchId' || key.toLowerCase() === 'total');
                    
                    if (key === 'group' || key === 'type' || key === 'isSeed') {
                        const select = document.createElement('select');
                        // ... select setup code ...
                        select.style.width = '100%';
                        select.style.background = 'transparent';
                        select.style.color = 'white';
                        select.style.border = 'none';

                        if (key === 'group') {
                            const groups = ['Recurve-70m', 'Recurve-30m', 'Traditional-30m', 'Traditional-20m-Open', 'Traditional-20m-Student'];
                            groups.forEach(g => {
                                const opt = document.createElement('option');
                                opt.value = g;
                                opt.textContent = g;
                                opt.style.background = '#1e293b';
                                if (g === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        } else if (key === 'type') {
                            ['Individual', 'Team'].forEach(t => {
                                const opt = document.createElement('option');
                                opt.value = t;
                                opt.textContent = t;
                                opt.style.background = '#1e293b';
                                if (t === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        } else if (key === 'isSeed') {
                            ['1', '0'].forEach(s => {
                                const opt = document.createElement('option');
                                opt.value = s;
                                opt.textContent = s === '1' ? 'Seed' : 'Normal';
                                opt.style.background = '#1e293b';
                                if (s === val) opt.selected = true;
                                select.appendChild(opt);
                            });
                        }

                        select.addEventListener('change', (e) => {
                            if (key === 'isSeed') row[key] = (e.target.value === '1');
                            else row[key] = e.target.value;
                        });
                        td.appendChild(select);
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = val !== undefined ? val : '';
                        if (isReadOnly) {
                            input.readOnly = true;
                            input.style.opacity = '0.7';
                            input.style.cursor = 'not-allowed';
                        }
                        
                        input.addEventListener('input', (e) => {
                            row[key] = e.target.value;
                            
                            // Auto-calculate total if r1 or r2 changes
                            if (key === 'r1' || key === 'r2') {
                                const val1 = parseInt(row.r1) || 0;
                                const val2 = parseInt(row.r2) || 0;
                                row.total = val1 + val2;
                                
                                // Find the total input in the same row and update it
                                const totalInput = tr.querySelector('input[data-key="total"]');
                                if (totalInput) totalInput.value = row.total;
                            }
                        });
                        
                        input.setAttribute('data-key', key);
                        td.appendChild(input);
                    }
                    
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        window.saveToGithub = async (type) => {
            const btn = document.getElementById(`save-${type}`);
            btn.disabled = true;
            btn.textContent = '同步中...';

            try {
                const authHeader = GITHUB_TOKEN.startsWith('github_pat_') ? `Bearer ${GITHUB_TOKEN}` : `token ${GITHUB_TOKEN}`;
                const newData = type === 'players' ? fullPlayerData : fullMatchData;

                const newCsv = Papa.unparse(newData);
                const prefix = currentAdminMode === 'Individual' ? 'individual_' : 'team_';
                const path = `data/${prefix}${type}.csv`;
                const prevPath = `data/${prefix}${type}_prev.csv`;
                
                const currentFileResp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': authHeader }
                });
                if (!currentFileResp.ok) throw new Error('無法讀取目前檔案');
                const currentFileData = await currentFileResp.json();
                const currentContentBase64 = currentFileData.content;
                const currentSha = currentFileData.sha;

                const prevFileResp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${prevPath}`, {
                    headers: { 'Authorization': authHeader }
                });
                let prevSha = null;
                if (prevFileResp.ok) {
                    const prevFileData = await prevFileResp.json();
                    prevSha = prevFileData.sha;
                }

                await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${prevPath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Backup ${type} data`,
                        content: currentContentBase64,
                        sha: prevSha || undefined
                    })
                });

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Update ${type} data via Admin Portal`,
                        content: btoa(unescape(encodeURIComponent(newCsv))),
                        sha: currentSha
                    })
                });

                if (response.ok) {
                    showToast('同步成功！舊版本已暫存至 _prev 檔案。');
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            } catch (err) {
                console.error(err);
                showToast('同步失敗: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = `同步全部分組${type === 'players' ? '積分' : '賽程'}至 GitHub`;
            }
        };

        function showToast(message, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
