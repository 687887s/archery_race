<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Race | 核心管理系統</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.0.1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .admin-wrapper { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: var(--sidebar-bg); padding: 3rem; border-radius: 1rem;
            width: 400px; border: 1px solid var(--glass-border); text-align: center;
        }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 0.75rem; border-radius: 0.5rem;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; outline: none;
        }
        .data-editor { margin-top: 2rem; background: var(--glass-bg); border-radius: 1rem; padding: 1.5rem; border: 1px solid var(--glass-border); }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; border: 1px solid var(--glass-border); }
        td input { background: transparent; border: none; color: white; width: 100%; }
        .btn-save { background: var(--accent-emerald); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.3rem; cursor: pointer; font-weight: 600; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="dark-theme">
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h2>管理員驗證</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">請輸入管理密碼及 GitHub Token</p>
            <div class="input-group">
                <label>後台密碼</label>
                <input type="password" id="admin-pass" placeholder="輸入密碼 (預設: 1234)">
            </div>
            <div class="input-group">
                <label>GitHub Token</label>
                <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button class="upload-btn" style="width: 100%; justify-content: center;" onclick="checkAuth()">進入系統</button>
            <p id="auth-error" style="color: #ef4444; margin-top: 1rem; display: none;">驗證失敗，請檢查輸入內容</p>
        </div>
    </div>

    <!-- Main Admin UI -->
    <div class="admin-wrapper hidden" id="admin-ui">
        <header class="editor-header">
            <div>
                <h1>賽事數據即時管理</h1>
                <p style="color: var(--text-secondary)">修改後點擊「同步至 GitHub」即可完成全球更新</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="upload-btn" onclick="logout()">登出</button>
                <a href="index.html" class="upload-btn" style="text-decoration:none">返回前端</a>
            </div>
        </header>

        <!-- Players Editor -->
        <div class="data-editor">
            <div class="editor-header">
                <h2>📊 積分賽排名管理</h2>
                <button class="btn-save" id="save-players" onclick="saveToGithub('players')">同步積分至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-players-table">
                    <thead>
                        <tr>
                            <th>姓名</th><th>單位</th><th>種子(1/0)</th><th>積分</th><th>勝</th><th>負</th><th>平</th>
                        </tr>
                    </thead>
                    <tbody id="edit-players-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Matches Editor -->
        <div class="data-editor">
            <div class="editor-header">
                <h2>🌿 淘汰賽賽程管理</h2>
                <button class="btn-save" id="save-matches" onclick="saveToGithub('matches')">同步賽程至 GitHub</button>
            </div>
            <div class="table-responsive">
                <table id="edit-matches-table">
                    <thead>
                        <tr>
                            <th>場次 ID</th><th>回合</th><th>選手 1</th><th>選手 2</th><th>勝者</th><th>比分 1</th><th>比分 2</th>
                        </tr>
                    </thead>
                    <tbody id="edit-matches-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { DataHandler } from './js/data-handler.js';
        const handler = new DataHandler();
        const REPO_OWNER = '687887s';
        const REPO_NAME = 'archery_race';
        let GITHUB_TOKEN = '';

        window.checkAuth = () => {
            const pass = document.getElementById('admin-pass').value.trim();
            GITHUB_TOKEN = document.getElementById('github-token').value.trim();
            
            // Allow both classic (ghp_) and fine-grained (github_pat_) tokens
            const isValidToken = GITHUB_TOKEN.startsWith('ghp_') || GITHUB_TOKEN.startsWith('github_pat_');
            
            if (pass === '1234' && isValidToken) {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('admin-ui').classList.remove('hidden');
                loadCurrentData();
            } else {
                document.getElementById('auth-error').style.display = 'block';
                if (!isValidToken && GITHUB_TOKEN !== '') {
                    document.getElementById('auth-error').textContent = 'Token 格式錯誤 (應以 ghp_ 或 github_pat_ 開頭)';
                } else {
                    document.getElementById('auth-error').textContent = '驗證失敗，請檢查密碼是否正確';
                }
            }
        };

        window.logout = () => location.reload();

        async function loadCurrentData() {
            try {
                // Load Players
                const pResp = await fetch('data/players.csv?t=' + Date.now());
                const pData = await handler.loadPlayers(await pResp.blob());
                renderEditor('edit-players-body', pData, ['name', 'unit', 'isSeed', 'points', 'wins', 'losses', 'draws']);

                // Load Matches
                const mResp = await fetch('data/matches.csv?t=' + Date.now());
                const mData = await handler.loadMatches(await mResp.blob());
                renderEditor('edit-matches-body', mData, ['matchId', 'round', 'player1', 'player2', 'winner', 'score1', 'score2']);
            } catch (err) {
                showToast('讀取原始數據失敗', true);
            }
        }

        function renderEditor(tbodyId, data, keys) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    const val = key === 'isSeed' ? (row[key] ? '1' : '0') : row[key];
                    td.innerHTML = `<input type="text" value="${val}" data-idx="${idx}" data-key="${key}">`;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        window.saveToGithub = async (type) => {
            const btn = document.getElementById(`save-${type}`);
            btn.disabled = true;
            btn.textContent = '同步中...';

            try {
                const tbody = document.getElementById(`edit-${type}-body`);
                const rows = Array.from(tbody.querySelectorAll('tr'));
                const data = rows.map(tr => {
                    const obj = {};
                    tr.querySelectorAll('input').forEach(input => {
                        obj[input.dataset.key] = input.value;
                    });
                    return obj;
                });

                const csv = Papa.unparse(data);
                const path = `data/${type}.csv`;
                
                // Get current file SHA for update
                const fileInfo = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                }).then(r => r.json());

                // Update file via API
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Update ${type} data via Admin Portal`,
                        content: btoa(unescape(encodeURIComponent(csv))),
                        sha: fileInfo.sha
                    })
                });

                if (response.ok) {
                    showToast('同步成功！數據已更新至 GitHub。');
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            } catch (err) {
                console.error(err);
                showToast('同步失敗: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = `同步${type === 'players' ? '積分' : '賽程'}至 GitHub`;
            }
        };

        function showToast(message, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
