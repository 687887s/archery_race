<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二屆長庚射箭公開邀請賽 | 即時賽況</title>
    <meta name="description" content="專業體育賽事即時賽況更新網頁，包含積分賽排名與淘汰賽賽程。">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/style.css?v=1.8.9">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>

<body class="dark-theme">
    <div class="app-container">
        <!-- Menu Toggle (Mobile & Desktop) -->
        <button id="menu-toggle" class="menu-toggle">☰</button>

        <!-- Sidebar Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

        <!-- Sidebar -->
        <aside class="sidebar collapsed" id="main-sidebar">
            <div class="logo">
                <span class="logo-icon">🏹</span>
                <div class="logo-text">
                    <h1>長庚射箭公開賽</h1>
                    <p>CGU x CGUST ARCHERY</p>
                </div>
            </div>
            <nav class="nav-menu">
                <div class="nav-section">
                    <h3>個人賽 Individual</h3>
                    <button class="nav-item active" data-type="Individual" data-view="standings">
                        <span class="icon">📊</span> 積分排名
                    </button>
                    <button class="nav-item" data-type="Individual" data-view="bracket">
                        <span class="icon">🌿</span> 淘汰賽程
                    </button>
                </div>
                <div class="nav-section">
                    <h3>團體賽 Team</h3>
                    <button class="nav-item" data-type="Team" data-view="standings">
                        <span class="icon">📊</span> 積分排名
                    </button>
                    <button class="nav-item" data-type="Team" data-view="bracket">
                        <span class="icon">🌿</span> 淘汰賽程
                    </button>
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>Real-time Updates v1.8.9</p>
                <p id="last-update-time" style="font-size: 10px; color: var(--text-secondary); margin-bottom: 5px;">
                    最後更新: --:--:--</p>
                <button onclick="location.reload(true)"
                    style="background: var(--accent-blue); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; margin-top: 5px;">
                    強制重新整理 (Force Reload)
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="view-title">
                    <h2 id="current-view-name">個人賽 | 積分排名</h2>
                </div>
                <div class="group-tabs" id="group-selector">
                    <button class="tab-item active" data-group="反曲70">反曲 70m</button>
                    <button class="tab-item" data-group="反曲30">反曲 30m</button>
                    <button class="tab-item" data-group="傳統30">傳統 30m</button>
                    <button class="tab-item" data-group="傳統20">傳統 20m</button>
                </div>
            </header>

            <section class="content-area" id="content-standings">
                <div class="card glass">
                    <div class="table-responsive">
                        <table id="standings-table">
                            <thead>
                                <tr style="position: sticky; top: 0; background: var(--sidebar-bg); z-index: 10;">
                                    <th>排名</th>
                                    <th>編號</th>
                                    <th>單位</th>
                                    <th id="head-name">姓名</th>
                                    <th>靶位</th>
                                    <th>單局成績</th>
                                    <th>總分</th>
                                    <th>X</th>
                                    <th>10+X</th>
                                </tr>
                            </thead>
                            <tbody id="standings-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="content-area hidden" id="content-bracket">
                <div class="bracket-wrapper">
                    <div id="bracket-container" class="bracket"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/app.js?v=1.8.9"></script>
</body>

</html>
