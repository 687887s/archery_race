<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二屆長庚射箭公開邀請賽 | 即時賽況</title>
    <meta name="description" content="專業體育賽事即時賽況更新網頁，包含積分賽排名與淘汰賽賽程。">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.0.4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Menu Toggle (Mobile & Desktop) -->
        <button id="menu-toggle" class="menu-toggle">☰</button>

        <!-- Sidebar Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

        <!-- Sidebar -->
        <aside class="sidebar collapsed" id="main-sidebar">
            <div class="logo">
                <span class="logo-icon">🏹</span>
                <div class="logo-text">
                    <h1>長庚射箭公開賽</h1>
                    <p>CGU x CGUST ARCHERY</p>
                </div>
            </div>
            <nav class="nav-menu">
                <div class="nav-section">
                    <h3>個人賽 Individual</h3>
                    <button class="nav-item active" data-type="Individual" data-view="standings">
                        <span class="icon">📊</span> 積分排名
                    </button>
                    <button class="nav-item" data-type="Individual" data-view="bracket">
                        <span class="icon">🌿</span> 淘汰賽程
                    </button>
                </div>
                <div class="nav-section">
                    <h3>團體賽 Team</h3>
                    <button class="nav-item" data-type="Team" data-view="standings">
                        <span class="icon">📊</span> 積分排名
                    </button>
                    <button class="nav-item" data-type="Team" data-view="bracket">
                        <span class="icon">🌿</span> 淘汰賽程
                    </button>
                </div>
            </nav>
            <div class="sidebar-footer">
                <p>Real-time Updates v1.0</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="view-title">
                    <h2 id="current-view-name">個人賽 | 積分排名</h2>
                </div>
                <div class="group-tabs" id="group-selector">
                    <button class="tab-item active" data-group="Recurve-70m">反曲 70m</button>
                    <button class="tab-item" data-group="Recurve-30m">反曲 30m</button>
                    <button class="tab-item" data-group="Traditional-30m">傳統 30m</button>
                    <button class="tab-item" data-group="Traditional-20m-Open">傳統 20m(公)</button>
                    <button class="tab-item" data-group="Traditional-20m-Student">傳統 20m(學)</button>
                </div>
            </header>

            <section class="content-area" id="content-standings">
                <!-- Standings Table will be rendered here -->
                <div class="card glass">
                    <div class="table-responsive">
                        <table id="standings-table">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>姓名</th>
                                    <th>單位</th>
                                    <th>積分</th>
                                    <th>勝</th>
                                    <th>負</th>
                                    <th>平</th>
                                </tr>
                            </thead>
                            <tbody id="standings-body">
                                <!-- Dynamic Content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="content-area hidden" id="content-bracket">
                <!-- Bracket Tree will be rendered here -->
                <div class="bracket-wrapper">
                    <div id="bracket-container" class="bracket">
                        <!-- Dynamic SVG/HTML Bracket -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script type="module" src="js/app.js?v=1.0.1"></script>
</body>
</html>
